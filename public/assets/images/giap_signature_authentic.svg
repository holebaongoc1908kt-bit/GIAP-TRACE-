<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" fill="none">
  <!-- Authentic Signature of General Vo Nguyen Giap -->
  <g stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Initial V & o flourish -->
    <path d="M 28,68 C 24,95 38,142 45,142 C 52,142 62,56 66,54 C 70,52 82,78 78,102 C 75,120 62,118 64,98 C 66,78 82,74 88,86" fill="none"/>
    <!-- Diacritic mark on Võ -->
    <path d="M 52,42 C 58,38 66,46 72,40 C 75,37 78,39 80,41" fill="none" stroke-width="4"/>
    
    <!-- Connected Nguyen cursive script -->
    <path d="M 88,86 C 90,118 78,168 84,170 C 92,172 104,82 108,76 C 112,70 126,72 122,96 C 118,124 105,174 116,176 C 124,177 132,118 136,96 C 140,78 152,78 150,102 C 148,124 140,166 148,168 C 154,170 164,122 168,98 C 172,78 184,80 180,104 C 176,128 170,165 178,166 C 184,167 194,115 198,88" fill="none"/>
    
    <!-- Accent roof on Nguyên -->
    <path d="M 166,56 L 174,48 L 182,56" fill="none" stroke-width="3.5"/>
    <path d="M 186,48 C 190,44 196,48 198,52" fill="none" stroke-width="3"/>

    <!-- Giap distinctive high loop & loops -->
    <path d="M 198,88 C 206,58 216,42 222,46 C 228,50 218,88 214,112 C 210,136 226,140 234,118 C 242,94 250,60 256,54 C 262,48 252,98 248,126 C 244,152 258,154 266,132 C 274,108 282,68 286,60" fill="none"/>
    
    <!-- Sharp ending flourish underline & dash -->
    <path d="M 242,142 C 252,154 270,158 286,138 C 294,126 304,98 308,82" fill="none" stroke-width="5"/>
    <path d="M 304,118 L 314,112" fill="none" stroke-width="5"/>
  </g>
</svg>
