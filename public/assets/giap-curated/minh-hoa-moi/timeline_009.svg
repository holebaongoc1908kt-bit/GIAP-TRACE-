<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#3A0E0E" />
      <stop offset="60%" stop-color="#1A0505" />
      <stop offset="100%" stop-color="#0D0202" />
    </radialGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>
    <linearGradient id="line-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EAB308" stop-opacity="0" />
      <stop offset="50%" stop-color="#EAB308" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#EAB308" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(212,175,55,0.07)" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="rgba(212,175,55,0.15)" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" fill="url(#bg-grad)" />
  <rect width="800" height="500" fill="url(#grid)" opacity="0.9" />

  <!-- Thematic Tactical Rings -->
  <g opacity="0.25" stroke="#EAB308" fill="none">
    <circle cx="395" cy="214" r="160" stroke-width="1" stroke-dasharray="4,8" />
    <circle cx="395" cy="214" r="110" stroke-width="1.5" />
    <circle cx="395" cy="214" r="60" stroke-width="1" stroke-dasharray="2,4" />
    <line x1="215" y1="214" x2="575" y2="214" stroke-width="1" stroke-dasharray="6,6" />
    <line x1="395" y1="34" x2="395" y2="394" stroke-width="1" stroke-dasharray="6,6" />
  </g>

  <!-- Mountain Contour Silhouette (Heroic military landscape) -->
  <path d="M0,380 Q120,330 240,360 T480,320 T720,350 L800,340 L800,500 L0,500 Z" fill="#170404" opacity="0.9" />
  <path d="M0,410 Q160,370 320,395 T640,380 L800,400 L800,500 L0,500 Z" fill="#0D0202" />

  <!-- Center Emblem: Golden Star inside Heritage Polygon -->
  <g transform="translate(395, 214)">
    <!-- Starburst Glow -->
    <circle cx="0" cy="0" r="48" fill="#EAB308" opacity="0.15" filter="url(#glow)" />
    <!-- Octagon Border -->
    <polygon points="0,-42 30,-30 42,0 30,30 0,42 -30,30 -42,0 -30,-30" 
             fill="#220606" stroke="url(#gold-grad)" stroke-width="2.5" />
    <!-- Golden Star -->
    <polygon points="0,-25 7,-8 25,-8 11,3 16,21 0,11 -16,21 -11,3 -25,-8 -7,-8" 
             fill="url(#gold-grad)" filter="url(#glow)" />
  </g>

  <!-- Golden Frame Borders -->
  <rect x="18" y="18" width="764" height="464" fill="none" stroke="rgba(212,175,55,0.3)" stroke-width="1.5" />
  <rect x="24" y="24" width="752" height="452" fill="none" stroke="rgba(212,175,55,0.15)" stroke-width="0.8" stroke-dasharray="6,6" />
  
  <!-- Corner Ornaments -->
  <g fill="#EAB308" opacity="0.8">
    <path d="M18,18 L34,18 L34,22 L22,22 L22,34 L18,34 Z" />
    <path d="M782,18 L766,18 L766,22 L778,22 L778,34 L782,34 Z" />
    <path d="M18,482 L34,482 L34,478 L22,478 L22,466 L18,466 Z" />
    <path d="M782,482 L766,482 L766,478 L778,478 L778,466 L782,466 Z" />
  </g>

  <!-- Top Badge: GIAP TRACE • MINH HỌA LỊCH SỬ -->
  <g transform="translate(400, 60)">
    <rect x="-160" y="-18" width="320" height="36" rx="18" fill="rgba(15,2,2,0.85)" stroke="#EAB308" stroke-width="1.5" />
    <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#EAB308" letter-spacing="2">
      ★ GIAP TRACE • MINH HỌA LỊCH SỬ ★
    </text>
  </g>

  <!-- Header Category Line -->
  <g transform="translate(400, 110)">
    <text x="0" y="0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FCD34D" letter-spacing="3" opacity="0.95">
      DÒNG CHẢY LỊCH SỬ
    </text>
    <line x1="-120" y1="10" x2="120" y2="10" stroke="url(#line-glow)" stroke-width="1.5" />
  </g>

  <!-- Bottom Title Section -->
  <g transform="translate(400, 395)">
    <!-- Semi-transparent plate for title readability -->
    <rect x="-330" y="-26" width="660" height="52" rx="10" fill="rgba(10,2,2,0.85)" stroke="rgba(212,175,55,0.4)" stroke-width="1" />
    <text x="0" y="8" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" letter-spacing="0.5">
      Đường Trường Sơn
    </text>
  </g>

  <!-- Bottom Caption Disclaimer -->
  <text x="400" y="452" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#D1D5DB" opacity="0.75" letter-spacing="1">
    Minh họa đồ họa chủ đề lịch sử • Không thay thế ảnh tư liệu gốc
  </text>
</svg>